name: tirei-voce

x-api-env: &api-env
  env_file:
    - path: ../.env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://tirei:tirei@postgres:5432/tirei_voce
    REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tirei
      POSTGRES_PASSWORD: tirei
      POSTGRES_DB: tirei_voce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tirei -d tirei_voce"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../apps/api
      target: dev
    <<: *api-env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../apps/api
      target: dev
    <<: *api-env
    command: >
      watchfiles --filter python "arq app.workers.main.WorkerSettings" app
    volumes:
      - ../apps/api:/app
      - /app/.venv
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      target: dev
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
