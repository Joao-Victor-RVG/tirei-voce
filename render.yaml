# Blueprint do Render: https://render.com/docs/blueprint-spec
# Só o "web" (nginx) é público; API e worker ficam na rede privada.
services:
  - type: web
    name: tirei-voce-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: ./apps/web
    dockerTarget: web
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: API_UPSTREAM
        value: http://tirei-voce-api:8000
      - key: REAL_IP_FROM
        value: 10.0.0.0/8

  - type: pserv
    name: tirei-voce-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    dockerTarget: api
    preDeployCommand: alembic upgrade head && python -m app.seed
    envVars:
      - fromGroup: tirei-voce
      - key: DATABASE_URL
        fromDatabase: { name: tirei-voce-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: tirei-voce-redis, property: connectionString }
      - key: PORT
        value: "8000"

  - type: worker
    name: tirei-voce-worker
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    dockerTarget: worker
    envVars:
      - fromGroup: tirei-voce
      - key: DATABASE_URL
        fromDatabase: { name: tirei-voce-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: tirei-voce-redis, property: connectionString }

  - type: keyvalue
    name: tirei-voce-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: tirei-voce-db
    databaseName: tirei_voce
    postgresMajorVersion: "16"

envVarGroups:
  - name: tirei-voce
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false # ex.: https://tirei-voce-web.onrender.com ou seu domínio
      - key: GOOGLE_REDIRECT_URI
        sync: false # <FRONTEND_URL>/api/v1/auth/google/callback
      - key: JWT_SECRET
        generateValue: true
      - key: DRAW_HMAC_KEY
        generateValue: true
      - key: DRAW_ENCRYPTION_KEY
        sync: false # make keys (precisa ser uma chave Fernet)
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false # make keys
      - key: VAPID_PRIVATE_KEY
        sync: false # make keys
      - key: SENTRY_DSN
        sync: false
