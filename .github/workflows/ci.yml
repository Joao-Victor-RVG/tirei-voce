name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (lint, types, testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tirei
          POSTGRES_PASSWORD: tirei
          POSTGRES_DB: tirei_voce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tirei" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://tirei:tirei@localhost:5432/tirei_voce_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy .
      - name: Pytest (cobertura ≥ 80%)
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Migrations sem pendências
        env:
          DATABASE_URL: postgresql+asyncpg://tirei:tirei@localhost:5432/tirei_voce_test
        run: uv run alembic upgrade head && uv run alembic check

  web:
    name: Web (lint, types, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contract:
    name: Tipos do front em dia com a API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: cd apps/api && uv sync --frozen
      - run: cd apps/web && pnpm install --frozen-lockfile
      - run: make api-types
      - name: Falha se openapi.json/schema.d.ts mudaram (rode make api-types)
        run: git diff --exit-code -- apps/web/openapi.json apps/web/src/api/schema.d.ts

  render:
    name: render.yaml válido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx --with pyyaml --with jsonschema --with certifi python -I infra/scripts/render_check.py render.yaml

  docker:
    name: Imagens de produção
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { context: apps/api, target: api }
          - { context: apps/api, target: worker }
          - { context: apps/web, target: web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
